version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/dynamic-mapper-ui"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # ngx-echarts majors track the Angular major (v22 needs @angular/core >=22). Re-enable
      # when the UI moves to Angular 22.
      - dependency-name: "ngx-echarts"
        versions: [">=22.0.0"]

  - package-ecosystem: "npm"
    directory: "/dynamic-mapper-smart-function"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # parser and eslint-plugin declare each other as exact-major peers, so they must move together;
    # separate PRs fail "npm ci" with ERESOLVE.
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"

  # Keeps action versions current, so runtime deprecations (e.g. Node 20) surface as PRs.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
