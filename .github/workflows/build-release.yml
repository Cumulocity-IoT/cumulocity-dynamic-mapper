# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build Mapper

on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu
          cache: maven
      - name: Extract version from tag
        id: version
        env:
          GIT_REF: ${{ github.ref }}
          GIT_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$GIT_REF" == refs/tags/v* ]]; then
            VERSION="${GIT_REF_NAME#v}"
          else
            VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${revision}' --non-recursive exec:exec)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Fast Unit Tests (runs during compile)
      - name: Run Unit Tests
        run: mvn -B test -Drevision=${{ env.VERSION }} --file pom.xml

      #Building Starter backend
      - name: Build Starter Backend
        run: mvn -B package -DskipTests -Drevision=${{ env.VERSION }} --file pom.xml
      # Produces the starter/standard/performance/max zips, each with and without the MQTT Service.
      - name: Package backend variants
        run: .github/scripts/package-backend.sh "${{ env.VERSION }}"
      #Deployment
      - name: deploy
        uses: actions/setup-node@v5
        with:
          # Must satisfy the "engines" range in dynamic-mapper-ui/package.json
          # (^20.19.0 || ^22.12.0), which is the intersection of what Angular 21,
          # @c8y/devkit and sharp declare. 22.x also matches local development, so CI and
          # developers exercise the same runtime.
          node-version: 22.x
          cache: npm
          cache-dependency-path: dynamic-mapper-ui/package-lock.json
      - name: Set npm version
        run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
        working-directory: ./dynamic-mapper-ui
      - run: npm ci
        working-directory: ./dynamic-mapper-ui
      - run: cp ./LICENSE ./dynamic-mapper-ui/LICENSE
        working-directory: ./
        
      # - run: npm install -g @angular/cli > /dev/null
      #   working-directory: ./dynamic-mapper-ui
      - run: npm run build --if-present
        working-directory: ./dynamic-mapper-ui
      - name: Zip Frontend Plugin
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dynamic-mapper-ui/dist/dynamic-mapper
          zip -r -q ../../dynamic-mapper-ui.zip *
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-pre') }}
          files: |
            ./dynamic-mapper-ui/dynamic-mapper-ui.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-starter.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-standard.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-performance.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-max.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-starter-withoutMQTTService.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-standard-withoutMQTTService.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-performance-withoutMQTTService.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-max-withoutMQTTService.zip
