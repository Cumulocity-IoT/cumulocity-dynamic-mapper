# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build Mapper

on:
  workflow_dispatch:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: zulu
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${revision}' --non-recursive exec:exec)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Fast Unit Tests (runs during compile)
      - name: Run Unit Tests
        run: mvn -B test -Drevision=${{ env.VERSION }} --file pom.xml

      # Fast Dispatcher Integration Tests
      - name: Run Dispatcher Integration Tests
        run: mvn -B verify -DskipTests -Drevision=${{ env.VERSION }} --file pom.xml

      # Full Transformation Validation (only on tags/releases)
      # NOTE: Currently DISABLED - requires full Spring Boot context setup
      # See TRANSFORMATION_TESTS_SETUP.md for configuration requirements
      # - name: Run Full Transformation Validation Tests
      #   if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      #   run: mvn -B verify -Pfull-validation --file pom.xml

      #Building Starter backend
      - name: Build Starter Backend
        run: mvn -B package -DskipTests -Drevision=${{ env.VERSION }} --file pom.xml
      - name: Packaging Starter Backend
        run: |
          mv ./dynamic-mapper-service/target/dynamic-mapper-service.zip ./dynamic-mapper-service/target/dynamic-mapper-service-starter.zip
          cp ./dynamic-mapper-service/target/dynamic-mapper-service-starter.zip ./dynamic-mapper-service/target/dynamic-mapper-service-starter-withoutMQTTService.zip
          mv ./dynamic-mapper-service/src/main/configuration/cumulocity-withoutMQTTService.json ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          sed -i 's/@project.version@/${{ env.VERSION }}/g' ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          zip ./dynamic-mapper-service/target/dynamic-mapper-service-starter-withoutMQTTService.zip ./dynamic-mapper-service/src/main/configuration/cumulocity.json -j
      #Packaging Standard backend
      - name: Packaging Standard Backend
        run: |
          cp ./dynamic-mapper-service/target/dynamic-mapper-service-starter.zip ./dynamic-mapper-service/target/dynamic-mapper-service-standard.zip
          mv ./dynamic-mapper-service/src/main/configuration/cumulocity-2c.json ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          sed -i 's/@project.version@/${{ env.VERSION }}/g' ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          zip ./dynamic-mapper-service/target/dynamic-mapper-service-standard.zip ./dynamic-mapper-service/src/main/configuration/cumulocity.json -j
          cp ./dynamic-mapper-service/target/dynamic-mapper-service-standard.zip ./dynamic-mapper-service/target/dynamic-mapper-service-standard-withoutMQTTService.zip
          mv ./dynamic-mapper-service/src/main/configuration/cumulocity-2c-withoutMQTTService.json ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          sed -i 's/@project.version@/${{ env.VERSION }}/g' ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          zip ./dynamic-mapper-service/target/dynamic-mapper-service-standard-withoutMQTTService.zip ./dynamic-mapper-service/src/main/configuration/cumulocity.json -j
      #Packaging performance backend
      - name: Packaging Performance Backend
        run: |
          cp ./dynamic-mapper-service/target/dynamic-mapper-service-standard.zip ./dynamic-mapper-service/target/dynamic-mapper-service-performance.zip
          mv ./dynamic-mapper-service/src/main/configuration/cumulocity-8c.json ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          sed -i 's/@project.version@/${{ env.VERSION }}/g' ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          zip ./dynamic-mapper-service/target/dynamic-mapper-service-performance.zip ./dynamic-mapper-service/src/main/configuration/cumulocity.json -j
          cp ./dynamic-mapper-service/target/dynamic-mapper-service-performance.zip ./dynamic-mapper-service/target/dynamic-mapper-service-performance-withoutMQTTService.zip
          mv ./dynamic-mapper-service/src/main/configuration/cumulocity-8c-withoutMQTTService.json ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          sed -i 's/@project.version@/${{ env.VERSION }}/g' ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          zip ./dynamic-mapper-service/target/dynamic-mapper-service-performance-withoutMQTTService.zip ./dynamic-mapper-service/src/main/configuration/cumulocity.json -j
      #Packaging max backend
      - name: Packaging Max Backend
        run: |
          cp ./dynamic-mapper-service/target/dynamic-mapper-service-performance.zip ./dynamic-mapper-service/target/dynamic-mapper-service-max.zip
          mv ./dynamic-mapper-service/src/main/configuration/cumulocity-16c.json ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          sed -i 's/@project.version@/${{ env.VERSION }}/g' ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          zip ./dynamic-mapper-service/target/dynamic-mapper-service-max.zip ./dynamic-mapper-service/src/main/configuration/cumulocity.json -j
          cp ./dynamic-mapper-service/target/dynamic-mapper-service-max.zip ./dynamic-mapper-service/target/dynamic-mapper-service-max-withoutMQTTService.zip
          mv ./dynamic-mapper-service/src/main/configuration/cumulocity-16c-withoutMQTTService.json ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          sed -i 's/@project.version@/${{ env.VERSION }}/g' ./dynamic-mapper-service/src/main/configuration/cumulocity.json
          zip ./dynamic-mapper-service/target/dynamic-mapper-service-max-withoutMQTTService.zip ./dynamic-mapper-service/src/main/configuration/cumulocity.json -j
      #Deployment
      - name: deploy
        uses: actions/setup-node@v2
        with:
          node-version: 20.x
      - name: Set npm version
        run: npm version ${{ env.VERSION }} --no-git-tag-version --allow-same-version
        working-directory: ./dynamic-mapper-ui
      - run: npm ci
        working-directory: ./dynamic-mapper-ui
      - run: cp ./LICENSE ./dynamic-mapper-ui/LICENSE
        working-directory: ./
        
      # - run: npm install -g @angular/cli > /dev/null
      #   working-directory: ./dynamic-mapper-ui
      - run: npm run build --if-present
        working-directory: ./dynamic-mapper-ui
      - name: Zip Frontend Plugin
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dynamic-mapper-ui/dist/dynamic-mapper
          zip -r -q ../../dynamic-mapper-ui.zip *
      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        id: create_release
        uses: softprops/action-gh-release@v2
        #uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref }}
          draft: true
          prerelease: ${{ contains(env.VERSION, '-pre') }}
          files: |
            ./dynamic-mapper-ui/dynamic-mapper-ui.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-starter.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-standard.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-performance.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-max.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-starter-withoutMQTTService.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-standard-withoutMQTTService.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-performance-withoutMQTTService.zip
            ./dynamic-mapper-service/target/dynamic-mapper-service-max-withoutMQTTService.zip