# CI workflow for pull requests and push to main/develop
name: Continuous Integration

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

# A newer push to the same branch/PR makes the running CI obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Fast unit tests (runs in parallel)
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu
          cache: maven


      - name: Run Unit Tests
        run: mvn -B clean test --file pom.xml

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/target/surefire-reports/*.xml

  # Job 2: Fast dispatcher integration tests
  dispatcher-tests:
    name: Dispatcher Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-tests
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu
          cache: maven


      - name: Run Dispatcher Integration Tests
        run: mvn -B clean verify -Pquick --file pom.xml

      - name: Publish Dispatcher Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: |
            **/target/failsafe-reports/TEST-*.xml

  # Job 3: the shipped JS code templates must still type-check against the Smart Function types.
  # Templates are what users copy into their mappings, so a renamed context method or a dropped
  # msg field has to fail here rather than in a user's running mapping.
  smart-function-contract:
    name: Smart Function Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: dynamic-mapper-smart-function/package-lock.json

      - run: npm ci
        working-directory: ./dynamic-mapper-smart-function

      # Runs check:templates first via the "pretest" hook, then the type unit tests.
      - name: Type-check templates and run type tests
        run: npm test
        working-directory: ./dynamic-mapper-smart-function

      # The editor's completion data is generated from the type definitions. Two things have to
      # hold, and they fail differently:
      #   1. regenerating is a no-op -- otherwise the committed file is stale and the mapping
      #      editor describes an API the types no longer have;
      #   2. the output compiles against the interface the UI's providers consume -- the UI is not
      #      built anywhere in this workflow, so without this the only place a malformed entry
      #      surfaces is a developer's `ng build`.
      - name: Editor completion data is up to date and compiles
        run: |
          npm run generate:editor-api
          npm run check:generated
          if [ -n "$(git status --porcelain -- ../dynamic-mapper-ui/src/shared/mapping/generated)" ]; then
            echo "::error::Generated editor API is stale. Run 'npm run generate:editor-api' in dynamic-mapper-smart-function and commit the result."
            exit 1
          fi
        working-directory: ./dynamic-mapper-smart-function

  # Job 3c: the Angular plugin. Lint and build gate the PR; unit tests are reported but do not
  # fail it yet, because a clean develop still has known failing specs (see the step below).
  ui:
    name: UI Lint, Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Must satisfy the "engines" range in dynamic-mapper-ui/package.json (^20.19.0 || ^22.12.0).
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: dynamic-mapper-ui/package-lock.json

      - run: npm ci
        working-directory: ./dynamic-mapper-ui

      - name: Lint
        run: npm run lint
        working-directory: ./dynamic-mapper-ui

      - name: Build
        run: npm run build
        working-directory: ./dynamic-mapper-ui

      # TODO: make this blocking (drop continue-on-error) once the pre-existing failing specs are fixed.
      - name: Unit tests (non-blocking)
        continue-on-error: true
        run: npm test -- --watch=false --browsers=ChromeHeadless
        working-directory: ./dynamic-mapper-ui

  # Job 4: Build verification
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, dispatcher-tests]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: zulu
          cache: maven


      - name: Build Package (Skip Docker to avoid rate limits)
        run: mvn -B clean package -DskipTests -Dmicroservice.package.containerSkip=true --file pom.xml

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dynamic-mapper-service
          path: dynamic-mapper-service/target/*.zip
          retention-days: 7

  # Job 5: Test report summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, dispatcher-tests, smart-function-contract, ui]
    if: always()
    permissions: {}
    steps:
      - name: Test Results Summary
        run: |
          echo "## Test Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dispatcher Tests | ${{ needs.dispatcher-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smart Function Contract | ${{ needs.smart-function-contract.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Build | ${{ needs.ui.result }} |" >> $GITHUB_STEP_SUMMARY
