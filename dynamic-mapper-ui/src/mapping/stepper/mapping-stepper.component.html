<c8y-stepper class="d-col no-align-items fit-h c8y-stepper--no-btns a-i-center"
  [disableDefaultIcons]="{ edit: true, done: false }" [customClasses]="[
        'col-xs-8',
        'm-t-24',
        'm-b-40',
        'p-0',
        'flex-no-shrink'
      ]" (selectionChange)="onStepChange($event)" linear #stepper>
  <ng-template c8yStepperIcon="final">
    <span [c8yIcon]="'hand-peace-o'"></span>
  </ng-template>

  <cdk-step label="Add and select connector">
    <div class="card-block flex-grow overflow-auto fit-w">
      <d11r-mapping-connector [showHeader]="true" [stepperConfiguration]="stepperConfiguration" [directions]="[mapping.direction]"
        [deploymentMapEntry]="deploymentMapEntry"
        (deploymentMapEntryChange)="deploymentMapEntryChange($event)"></d11r-mapping-connector>
    </div>
    <c8y-stepper-buttons data-cy="dm-mapping-stepper-buttons-connector" class="d-block card-footer p-24 separator fit-w sticky-bottom bg-level-0"
      [disabled]="connectorSelectionEmpty()" (onCancel)="cancel.emit()" (onNext)="onNextStep($event)"
      [labels]="labels"></c8y-stepper-buttons>
  </cdk-step>

  <cdk-step label="General settings" [stepControl]="propertyFormly">
    <div class="card-block flex-grow overflow-auto fit-w">
      <d11r-mapping-properties [mapping]="mapping" [stepperConfiguration]="stepperConfiguration"
        [propertyFormly]="propertyFormly" [deploymentMapEntry]="deploymentMapEntry"
        (propertiesChange)="onPropertiesChange($event)" (targetAPIChanged)="onTargetAPIChanged($event)">
      </d11r-mapping-properties>
    </div>

    <c8y-stepper-buttons data-cy="dm-mapping-stepper-buttons-general" class="d-block card-footer p-24 separator fit-w sticky-bottom bg-level-0"
      (onCancel)="cancel.emit()" (onNext)="onNextStep($event)" [labels]="labels">
    </c8y-stepper-buttons>
  </cdk-step>

  <cdk-step label="Select templates" [stepControl]="filterFormly">
    <div class="p-16 p-t-0 flex-no-shrink separator-bottom col-xs-12">
      <h5 class="text-medium text-center" translate>
        Define templates for source &amp; target payload
      </h5>
    </div>
    <div class="card-block flex-grow overflow-auto fit-w">
    @if (stepperViewModel) {
      <d11r-mapping-template-step #templateStep
        [mapping]="mapping"
        [stepperConfiguration]="stepperConfiguration"
        [feature]="feature"
        [sourceSystem]="sourceSystem"
        [targetSystem]="targetSystem"
        [sourceTemplate]="sourceTemplate"
        [targetTemplate]="targetTemplate"
        [editorOptionsSourceTemplate]="editorOptionsSourceTemplate"
        [editorOptionsTargetTemplate]="editorOptionsTargetTemplate"
        [schemaSource]="schemaSource"
        [schemaTarget]="schemaTarget"
        [stepperViewModel]="stepperViewModel"
        [templateForm]="templateForm"
        [filterFormly]="filterFormly"
        [filterFormlyFields]="filterFormlyFields"
        (targetTemplateChange)="targetTemplate = $event" (filterMappingChange)="onFilterMappingChange($event)">
        @if (stepperViewModel?.showExtensionSelectors) {
        <ng-container extensionSource>
          <d11r-mapping-extension-selector side="source" dataCyPrefix="dm-mapping-stepper" [form]="templateForm" [mapping]="mapping"
            [showSelectors]="stepperViewModel?.showExtensionSelectorsSource" [showInternalNote]="stepperViewModel?.showInternalExtensionNote"
            [isLoading]="isLoadingExtensions" [hasParameter]="hasExtensionParameter" [extensionItems]="extensionItems"
            [extensionEvents]="extensionEventItems$"></d11r-mapping-extension-selector>
        </ng-container>
        }
        @if (stepperViewModel?.showExtensionSelectors) {
        <ng-container extensionTarget>
          <d11r-mapping-extension-selector side="target" dataCyPrefix="dm-mapping-stepper" [form]="templateForm" [mapping]="mapping"
            [showSelectors]="stepperViewModel?.showExtensionSelectorsTarget" [showInternalNote]="stepperViewModel?.showInternalExtensionNote"
            [isLoading]="isLoadingExtensions" [hasParameter]="hasExtensionParameter" [extensionItems]="extensionItems"
            [extensionEvents]="extensionEventItems$"></d11r-mapping-extension-selector>
        </ng-container>
        }
      </d11r-mapping-template-step>
    }
    </div>
    <c8y-stepper-buttons data-cy="dm-mapping-stepper-buttons-templates" class="d-block card-footer p-24 separator fit-w sticky-bottom bg-level-0" (onCancel)="cancel.emit()"
      (onNext)="onNextStep($event)" (onBack)="onBackStep($event)"
      [labels]="{ next: 'Next', cancel: 'Cancel' }"></c8y-stepper-buttons>
  </cdk-step>

  <cdk-step label="Transformation" [stepControl]="templateForm">
    <div class="card-block flex-grow overflow-auto fit-w">
      <d11r-mapping-transformation-step #transformationStepRef [mapping]="mapping" [stepperConfiguration]="stepperConfiguration"
        [sourceTemplate]="sourceTemplate" [targetTemplate]="targetTemplate" [sourceSystem]="sourceSystem"
        [targetSystem]="targetSystem" [feature]="feature" [aiAgentDeployed]="aiAgentDeployed" [aiCapabilitiesDisabled]="aiCapabilitiesDisabled" [aiAgent]="aiAgent"
        [schemaSource]="schemaSource" [schemaTarget]="schemaTarget" [mappingCode]="mappingCode"
        [codeEditorLabel]="codeEditorLabel" [codeEditorHelp]="codeEditorHelp" [isBeforeSubstitutionStep]="currentStepIndex < STEP_DEFINE_SUBSTITUTIONS"
        (mappingCodeChange)="mappingCode = $event" (substitutionsChange)="onSubstitutionsChange($event)">

        <!-- Project code editor content if needed -->
        @if (stepperViewModel?.showCodeEditorSection) {
        <ng-container codeEditor>
          <d11r-mapping-code-editor-section dataCyPrefix="dm-mapping-stepper" [label]="codeEditorLabel" [help]="codeEditorHelp"
            [code]="mappingCode" (codeChange)="onValueCodeChange($event)" [editorOptions]="editorOptions"
            [templateId]="templateId" [codeTemplateItems]="codeTemplateItems" (templateSelected)="templateId = $event; onSelectCodeTemplate()"
            (createTemplate)="onCreateCodeTemplate()" [aiButtonLabel]="aiButtonLabel" [aiGenerationDisabled]="aiGenerationDisabled"
            [aiAgentDeployed]="aiAgentDeployed" [aiCapabilitiesDisabled]="aiCapabilitiesDisabled" (generate)="openGenerateSubstitutionDrawer()"
            [showInternalNote]="stepperViewModel?.showInternalExtensionNote" (editorInit)="registerCompletionProvider()"></d11r-mapping-code-editor-section>
        </ng-container>
        }
      </d11r-mapping-transformation-step>
    </div>

    <c8y-stepper-buttons data-cy="dm-mapping-stepper-buttons-transformation" class="d-block card-footer p-24 separator fit-w sticky-bottom bg-level-0"
      (onCancel)="cancel.emit()" (onNext)="onNextStep($event)" (onBack)="onBackStep($event)"
      [labels]="{ next: 'Next', cancel: 'Cancel' }">
    </c8y-stepper-buttons>
  </cdk-step>

  <cdk-step state="final" stepLabel="step3" label="Test mapping">
    <div class="card-block flex-grow overflow-auto fit-w">
      <d11r-mapping-testing #mappingTestingStep [updateTestingTemplate]="
              updateTestingTemplate
            " [mapping]="mapping" [stepperConfiguration]="stepperConfiguration"
        (sourceTemplateChanged)="onTestingSourceTemplateChanged($event)"></d11r-mapping-testing>
    </div>
    <c8y-stepper-buttons data-cy="dm-mapping-stepper-buttons-test" class="d-block card-footer p-24 separator fit-w sticky-bottom bg-level-0"
      (onCustom)="onCommitButton()" (onCancel)="cancel.emit()" (onBack)="onBackStep($event)"
      [disabled]="( !feature?.userHasMappingAdminRole && !feature?.userHasMappingCreateRole)"
      [attr.title]="(!feature?.userHasMappingAdminRole && !feature?.userHasMappingCreateRole)
        ? ('Requires the Mapping Admin or Mapping Create role.' | translate) : null"
      [labels]="{ custom: 'Confirm' }">
    </c8y-stepper-buttons>
  </cdk-step>
</c8y-stepper>
