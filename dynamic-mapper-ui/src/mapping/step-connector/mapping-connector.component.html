<div class="col-xs-12 flex-grow no-gutter d-col">
  @if (showHeader && stepperConfiguration.editorMode === EditorMode.READ_ONLY) {
  <div class="p-16 p-t-0 flex-no-shrink separator-bottom col-xs-12">
    <h5 class="text-medium text-center">
      <span translate>Selected connectors</span>
      <span class="label label-primary text-12">{{ 'Read Only' }}</span>
    </h5>
  </div>
  }
  <div class="card-inner-scroll fit-h flex-grow">
    <div class="card-block p-b-0 fit-h">
      <div class="col-md-12 col-lg-12">
        <!-- <button
          type="button"
          name="addConfiguration"
          id="addConfiguration"
          class="btn btn-default btn-sm m-b-24"
          (click)="onConfigurationAddOrUpdate(undefined)"
          translate
          [disabled]="stepperConfiguration.editorMode === EditorMode.READ_ONLY"
          title="Add connector"
        >
          <i c8yIcon="plus-circle-o"></i>&nbsp;Add connector
        </button> -->
        <d11r-mapping-connector-grid
          [selectable]="true"
          [directions]="directions"
          [readOnly]="readOnly"
          [deploymentMapEntry]="deploymentMapEntry"
          (deploymentMapEntryChange)="onDeploymentMapEntryChanged($event)"
        ></d11r-mapping-connector-grid>
      </div>
    </div>
  </div>
</div>
