<c8y-modal [title]="isDuplicate || isUpdate ? 'Update properties of substitution' : 'Edit properties of substitution' "
  (onClose)="onSave()" (onDismiss)="onDismiss()" [labels]="labels" [headerClasses]="'modal-header dialog-header'"
  [disabled]="disabled$ | async">
  <ng-container c8y-modal-title>
    <span [c8yIcon]="'pencil'"></span>
  </ng-container>
  <div class="p-24">
    @if (isDuplicate) {
      <div>
        <p class="text-medium">
          {{ 'You are about to overwrite the existing substitution: # ' + (duplicateSubstitutionIndex + 1) | translate }}
        </p>
        <br />
        <div class="text-center">
          <pre>{{ substitutionText }}</pre>
        </div>
        <label class="c8y-switch d-inline p-t-8">
          <input type="checkbox" [(ngModel)]="override" [ngModelOptions]="{standalone: true}"
            (ngModelChange)="onOverrideChanged()" data-cy="dm-substitution-edit-override-toggle" />
          <span></span>
          <span>
            {{ 'Overwrite existing substitution' | translate }}
          </span>
        </label>
      </div>
    }
    <form [formGroup]="substitutionForm">
      <c8y-form-group>
        <label>
          <span>
            {{ 'Substitution [ pathSource —> pathTarget ]' | translate }}
          </span>
        </label>
        <input type="text" readOnly formControlName="substitution" class="form-control" data-cy="dm-substitution-edit-substitution-input" />
      </c8y-form-group>
      <c8y-form-group>
        <label class="c8y-switch d-inline p-t-8" title="Expand as array">
          <input type="checkbox" formControlName="expandArray" data-cy="dm-substitution-edit-expand-array-toggle" />
          <span></span>
          <span>
            {{ 'Expand as array' | translate }}
          </span>
        </label>
        <button type="button" placement="right" [popover]="'Current expression extracts an array. Consider to use the option
              Expand Array if you want to create multiple
              measurements, alarms, events or devices, i.e.
              multi-device or multi-value'" triggers="focus" class="btn-help" aria-label="Help content"></button>
      </c8y-form-group>
      <c8y-form-group>
        <label>
          <span>Repair strategy</span>
          <span> &nbsp;</span>
          <button type="button" placement="right" [popover]="'Strategy defining what should happen when extracted arrays in
            different expressions do not have the same size and define how are missing
            values handled.'" triggers="focus" class="btn-help" aria-label="Help content"></button>
        </label>
        <div class="c8y-select-wrapper">
          <select class="form-control" formControlName="repairStrategy" name="repairStrategy" data-cy="dm-substitution-edit-repair-strategy-select">
            @for (t of repairStrategyOptions; track t) {
              <option [value]="t.value">
                {{ t.label | formatStringAsWords}}
              </option>
            }
          </select>
        </div>
      </c8y-form-group>
    </form>
  </div>
</c8y-modal>
