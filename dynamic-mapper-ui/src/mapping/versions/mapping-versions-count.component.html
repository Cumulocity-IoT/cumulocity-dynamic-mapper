<c8y-title translate>Versions</c8y-title>
<c8y-action-bar-item [placement]="'right'">
  <button class="btn btn-link" title="{{ 'Refresh' | translate }}" (click)="refresh()">
    <i c8yIcon="refresh"></i>
    {{ 'Refresh' | translate }}
  </button>
</c8y-action-bar-item>

<div class="card">
  <div class="card-block">
    @if (isLoading$ | async) {
      <c8y-loading></c8y-loading>
    }
    <c8y-data-grid
      [configureColumnsEnabled]="false"
      [title]="title | translate"
      [columns]="columns"
      [rows]="rows$ | async"
      [pagination]="pagination"
      [actionControls]="actionControls">
    </c8y-data-grid>
  </div>
</div>
