<div class="d-col flex-nowrap no-align-items p-48 flex-grow col-md-12 col-md-offset-0 c8y-stepper--no-btns">
  <div class="card card--fullpage d-col flex-grow">
    <!-- Header -->
    <div class="card-header separator j-c-center">
      <h4 class="card-title d-flex">
        <i [c8yIcon]="'list'" class="icon-32 m-r-16"></i>
        <span class="m-t-8">{{ 'Versions of' | translate }} {{ mapping.name }}</span>
      </h4>
    </div>

    <!-- Body -->
    <div class="card-inner-scroll flex-grow">
      <div class="card-block">
        @if (loading) {
          <c8y-loading></c8y-loading>
        } @else {
          <c8y-data-grid [title]="'Versions' | translate" [columns]="columns" [rows]="rows$ | async"
            [pagination]="pagination" [actionControls]="actionControls" [selectable]="false"
            [configureColumnsEnabled]="false">
            <c8y-ui-empty-state [icon]="'c8y-icon dlt-c8y-icon-layers'"
              [title]="'No versions yet.' | translate"
              [subtitle]="'Edit the mapping to create a draft, then publish it to create the first version.' | translate"
              [horizontal]="true">
            </c8y-ui-empty-state>
          </c8y-data-grid>
        }
      </div>
    </div>

    <!-- Footer -->
    <div class="card-footer separator p-24 text-center flex-no-shrink">
      <button type="button" class="btn btn-default" data-cy="dm-version-close" (click)="close()">
        {{ 'Close' | translate }}
      </button>
    </div>
  </div>
</div>
