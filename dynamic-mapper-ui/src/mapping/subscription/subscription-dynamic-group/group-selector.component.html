<div class="d-col flex-nowrap no-align-items p-48 flex-grow col-md-12 col-md-offset-0 c8y-stepper--no-btns">
  <div class="card card--fullpage d-col flex-grow">
    <div class="card-header separator j-c-center">
      <h4 id="drawerTitle" class="card-title d-flex">
        <i [c8yIcon]="'subscription'" class="icon-32 m-r-16"></i>
        <span class="m-t-8" translate>Select devices group to subscribe to all device for outbound mappings</span>
      </h4>
    </div>
    <div class="card-block flex-grow">
      <c8y-asset-selector-miller [(ngModel)]="deviceList" data-cy="dm-group-selector-selector" [config]="{
            groupsSelectable: true,
            groupsOnly: true,
            columnHeaders: true,
            showFilter: true,
            showUnassignedDevices: false,
            showChildDevices: false,
            search: true,
            multi: true,
            showSelected: true
          }" class="bg-component"></c8y-asset-selector-miller>
    </div>
    <div class="card-footer separator p-24 text-center flex-no-shrink">
      <button type="button" name="cancel" class="btn btn-default" (click)="clickedCancel()" data-cy="dm-group-selector-cancel" translate>
        Cancel
      </button>
      <button type="button" name="save" class="btn btn-primary m-l-8" (click)="clickedUpdateSubscription()" data-cy="dm-group-selector-save" translate>
        Save
      </button>
    </div>
  </div>
</div>
