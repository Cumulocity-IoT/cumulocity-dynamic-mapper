<div class="d-col flex-nowrap no-align-items p-48 flex-grow col-md-12 col-md-offset-0 c8y-stepper--no-btns">
  <div class="card card--fullpage d-col flex-grow">
    <div class="card-header separator j-c-center">
      <h4 id="drawerTitle" class="card-title d-flex">
        <i [c8yIcon]="'subscription'" class="icon-32 m-r-16"></i>
        <span class="m-t-8" translate>Select devices types to subscribe to for outbound mappings</span>
      </h4>
    </div>
    <div class="card-block flex-grow">
      <div class="container-fluid p-24">
        @if (typeList.length === 0) {
        <div class="d-flex a-i-center fit-w" style="border: 1px dashed var(--c8y-root-component-separator-color); border-radius: 4px; padding: 8px 8px 8px 16px;">
          <span class="text-muted flex-grow" translate>No device types defined. Saving now removes the type-based subscription.</span>
          <button type="button" class="btn btn-dot text-primary" title="{{ 'Add' | translate }}" [attr.aria-label]="'Add' | translate" (click)="add()" data-cy="dm-type-selector-add-first">
            <i c8yIcon="plus-circle"></i>
          </button>
        </div>
        }
        <ul class="list-unstyled p-t-16" c8yInputGroupListContainer>
          @for (item of typeList; track trackByFn(i, item); let i = $index) {
          <li class="m-b-8 fit-w" [attr.data-cy]="'dm-type-selector-row-' + i">
            <c8y-input-group-list [index]="i" (onAdd)="add()" (onRemove)="remove(i)" [minus]="true">
              <div class="col-xs-11 p-l-0">
                <input class="form-control" placeholder="{{ 'e.g.' }} placeholder" type="text" [required]="true"
                  [attr.data-cy]="'dm-type-selector-input-' + i"
                  [(ngModel)]="typeList[i]" />
              </div>
            </c8y-input-group-list>
          </li>
          }
        </ul>
      </div>
    </div>
    <div class="card-footer separator p-24 text-center flex-no-shrink">
      <button type="button" name="cancel" class="btn btn-default" (click)="clickedCancel()" data-cy="dm-type-selector-cancel" translate>
        Cancel
      </button>
      <button type="button" name="update" class="btn btn-primary m-l-8" (click)="clickedUpdateSubscription()" [disabled]="!hasValidType" data-cy="dm-type-selector-save" translate>
        Save
      </button>
    </div>
  </div>
</div>
