<div class="card-header separator" style="justify-content: center">
  <h4 class="card-title d-flex">
    <i class="btn btn-ai btn-sm btn-ai-hint ai-icon m-r-8" style="margin-top:4px;"><span></span></i>
    <span class="m-t-8">{{ drawerTitle }} with agent:</span>
    <span class="label label-success m-l-8 m-t-8 m-b-8 text-16">{{aiAgent.name}}</span>
  </h4>
</div>

<div class="card-inner-scroll fit-h">
  @if (aiAgent && clientAgentDefinition) {
  <c8y-agent-chat
    [agent]="clientAgentDefinition"
    [variables]="variables"
    [suggestions]="suggestions"
    [groundingContextProvider]="groundingContextProvider"
    [skipHealthCheck]="true"
    [chatConfig]="chatConfig"
    [assistantMessageDisplayConfig]="assistantMessageDisplayConfig"
    (onMessageFinish)="onMessageFinish($event)">
  </c8y-agent-chat>
  }
</div>

@if (validationIssues.length) {
<div class="alert alert-warning m-b-0 m-l-16 m-r-16 flex-no-shrink" data-cy="dm-ai-prompt-issues">
  <div class="d-flex a-i-center m-b-8">
    <i c8yIcon="exclamation-triangle" class="m-r-8"></i>
    <strong translate>Check the generated result before saving</strong>
  </div>
  <ul class="m-b-8 p-l-24">
    @for (issue of validationIssues; track issue) {
    <li class="text-13">{{ issue }}</li>
    }
  </ul>
  <button type="button" class="btn btn-default btn-sm" (click)="askAIToFixIssues()" data-cy="dm-ai-prompt-fix" translate>
    Ask the agent to fix these
  </button>
</div>
}

<div class="card-footer separator text-center flex-no-shrink">
  <div class="form-group">
    <button type="button" name="update" class="btn btn-primary" (click)="save()" [disabled]="!valid" data-cy="dm-ai-prompt-save" translate>
      Save
    </button>
    <button type="button" name="update" class="btn btn-primary" (click)="cancel()" data-cy="dm-ai-prompt-cancel" translate>
      Cancel
    </button>
  </div>
</div>
