<div class="form-group p-b-8 fit-h d-col">
  <div class="row p-b-8">
    <div class="col-lg-5">
      <div class="d-flex">
        <label translate class="m-t-4">{{ label }}</label>
        <span class="hidden-xs hidden-sm">
          <ng-template #popupTemplateCodeHelp>
            <div [innerHtml]="help"></div>
          </ng-template>
          <button type="button" placement="right" [popover]="popupTemplateCodeHelp" triggers="focus" class="btn-help"
            aria-label="Help content"></button>
        </span>
      </div>
    </div>
    <div class="flex-grow col-lg-2 p-t-4">
      <button type="button" name="generateSubstitution" [attr.data-cy]="dataCyPrefix + '-generate-ai'" class="btn btn-ai btn-sm"
        (click)="generate.emit()" [title]="aiButtonLabel | translate" [disabled]="aiGenerationDisabled">
        <span>{{ aiButtonLabel | translate }}</span>
      </button>
      @if (!aiAgentDeployed) {
      <button class="btn-help btn-help--sm p-l-4" [attr.aria-label]="'Help' | translate"
        [popover]="(aiCapabilitiesDisabled
          ? 'AI capabilities are disabled in this tenant.'
          : 'AI Assistant is disabled if AI Agent is not deployed in this tenant or no agent is defined.') | translate"
        placement="right" container="body" triggers="focus" type="button"></button>
      }
    </div>
    <div class="col-lg-5 p-r-16">
      <div class="input-group">
        <c8y-select [attr.data-cy]="dataCyPrefix + '-code-template-select'" [items]="codeTemplateItems" [ngModel]="templateId"
          (ngModelChange)="templateSelected.emit($event)" name="templateSelect" [filterItems]="true" labelProperty="label"
          placeholder="{{ 'Select template...' | translate }}" aria-label="Code Template" class="select-template">
        </c8y-select>
        <div class="input-group-btn">
          <button type="button" name="update" [attr.data-cy]="dataCyPrefix + '-code-template-create'" class="btn btn-default btn-sm"
            (click)="createTemplate.emit()" translate>
            Create new code template
          </button>
        </div>
      </div>
    </div>
  </div>
  @if (showEditor) {
  <c8y-editor [attr.data-cy]="dataCyPrefix + '-code-editor'" [editorOptions]="editorOptions" class="form-control flex-grow"
    style="min-height: 630px" monacoEditorMarkerValidator [ngModel]="code" (ngModelChange)="codeChange.emit($event)"
    (editorInit)="editorInit.emit()">
  </c8y-editor>
  }
</div>
@if (showInternalNote) {
<div class="p-t-48">
  <small class="text-muted">{{ 'No template to edit — the payload structure comes from the Protobuf schema in the selected extension.' | translate }}</small>
</div>
}
