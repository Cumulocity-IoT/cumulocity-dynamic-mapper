<c8y-modal [title]="'Add Processor Extension' | translate" (onClose)="onDone()" (onDismiss)="onDismiss()" [labels]="labels" [headerClasses]="'modal-header dialog-header'"
  [disabled]="false">
  <ng-container c8y-modal-title>
    <span [c8yIcon]="'plugin'"></span>
  </ng-container>
  <div class="animated fadeIn">
      @if (!isAppCreated) {
        <c8y-form-group [hasError]="!!errorMessage" class="m-auto modal-drop-area">
          <c8y-drop-area (dropped)="onFileDroppedEvent($event)" [accept]="'.jar'" [loading]="isLoading"
            [maxAllowedFiles]="1" [maxFileSizeInMegaBytes]="maxFileSizeInMegaBytes"
            [message]="'Upload a *.jar file' | translate" [progress]="progress$ | async"
            class="drop-area">
          </c8y-drop-area>
          <c8y-messages>
            @if (errorMessage) {
              <c8y-message>
                {{ errorMessage | translate }}
              </c8y-message>
            }
          </c8y-messages>
        </c8y-form-group>
        <label class="c8y-switch m-t-16" data-cy="dm-add-extension-overwrite">
          <input type="checkbox" [(ngModel)]="overwrite" [disabled]="isLoading" />
          <span></span>
          <span>{{ 'Replace an existing extension with the same name' | translate }}</span>
        </label>
      } @else {
        <div class="d-flex a-i-center j-c-center modal-success-area">
          <c8y-operation-result text="{{ successText | translate }}" [vertical]="true" [size]="84" class="lead"
            type="success">
          </c8y-operation-result>
        </div>
        @if (extensionName) {
          <!-- Mappings refer to the extension by this name (the file name without ".jar") -->
          <p class="text-center m-t-16" data-cy="dm-add-extension-name">
            {{ 'Extension name' | translate }}: <strong>{{ extensionName }}</strong>
          </p>
        }
      }
  </div>
</c8y-modal>
