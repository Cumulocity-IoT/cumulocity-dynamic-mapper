<c8y-title translate>Code template</c8y-title>

<c8y-action-bar-item [placement]="'left'">
  <div class="d-flex">
    <div class="c8y-select-wrapper" style="max-width: 500px">
      <select class="form-control" (change)="onSelectCodeTemplate()" [(ngModel)]="template" name="templateSelect"
        required>
        <option [ngValue]="null" disabled>Select template...</option>
        @for (item of codeTemplateEntries$ | async; track item) {
        <option [ngValue]="item.key">
          {{ item.name }} ({{ item.readonly ? 'read-only' : 'editable' }})
        </option>
        }
      </select>
    </div>
  </div>
</c8y-action-bar-item>

<c8y-action-bar-item [placement]="'right'">
  <button class="btn btn-link"
    title="{{ 'Delete this custom template permanently. System templates cannot be deleted — use Init system code templates to restore them.' | translate }}"
    (click)="onDeleteCodeTemplate()" [disabled]="codeTemplateDecoded?.internal || !feature?.userHasMappingAdminRole">
    <i c8yIcon="minus-circle"></i>
    {{ 'Delete' | translate }}
  </button>
  <button class="btn btn-link" title="{{ 'Edit metadata' | translate }}" (click)="onRenameCodeTemplate()"
    [disabled]="codeTemplateDecoded?.internal || !feature?.userHasMappingAdminRole">
    <i c8yIcon="edit"></i>
    {{ 'Edit' | translate }}
  </button>
  <button class="btn btn-link" title="{{ 'Duplicate' | translate }}" (click)="onDuplicateCodeTemplate()"
    [disabled]="codeTemplateDecoded?.templateType === TemplateType.SHARED || codeTemplateDecoded?.templateType === TemplateType.SYSTEM || !feature?.userHasMappingAdminRole">
    <i c8yIcon="duplicate"></i>
    {{ 'Duplicate' | translate }}
  </button>
  <button class="btn btn-link"
    title="{{ 'Restore all system (read-only) templates to their factory defaults. Your custom templates are not affected.' | translate }}"
    (click)="onInitSystemCodeTemplate()" [disabled]="!feature?.userHasMappingAdminRole">
    <i c8yIcon="reset"></i>
    {{ 'Init system code templates' | translate }}
  </button>
  <button class="btn-help btn-help--sm" [attr.aria-label]="'Help' | translate" popover="{{
      'Restores all read-only system templates (SHARED, SYSTEM, and built-in transformation types) to their factory defaults. Custom templates you created are not affected.'
        | translate
    }}" placement="bottom left" triggers="focus" type="button"></button>
  <button class="btn btn-link" title="{{ 'Refresh' | translate }}" (click)="refresh()">
    <i c8yIcon="refresh"></i>
    {{ 'Refresh' | translate }}
  </button>
</c8y-action-bar-item>
<c8y-action-bar-item [placement]="'right'">
  <ng-template #popTemplateCodeHelp>
    <div [innerHtml]="codeEditorHelp"></div>
  </ng-template>
  <button type="button" placement="left" [popover]="popTemplateCodeHelp" triggers="click" class="btn-help"
    containerClass="wide-popover" container="body" aria-label="Help content"></button>
</c8y-action-bar-item>
<div class="card content-fullpage d-grid">
  @if (isLoading) {
  <c8y-loading></c8y-loading>
  } @else {

  <c8y-editor [editorOptions]="editorOptions" monacoEditorMarkerValidator [ngModel]="codeTemplateDecoded?.code"
    (ngModelChange)="onValueCodeChange($event)" (editorInit)="registerCompletionProvider()" class="form-control fit-h">
  </c8y-editor>

  <div class="card-footer separator p-24 text-center flex-no-shrink">
    <button type="button" name="save" class="btn btn-primary" (click)="onSaveCodeTemplate()"
      [disabled]="codeTemplateDecoded?.readonly || !feature?.userHasMappingAdminRole" translate>
      Save
    </button>
  </div>
  }
</div>
