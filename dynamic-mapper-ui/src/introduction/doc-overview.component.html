  <div>
    <c8y-title>{{ 'Home' | translate }}</c8y-title>
    <a id="top"></a>
    <div class="text-right m-b-16">
      <a (click)="scrollToElement('top')" class="to-the-top" role="button" aria-label="Scroll to top"
>
        <i class="dlt-c8y-icon-chevron-up m-r-4"></i> Top
      </a>
    </div>
    <div class="doc-content" #docBody>
    <!-- Intro prose, up to the live counts below. -->
    <div [innerHTML]="htmlIntro"></div>

    <!-- Native widget: live mapping/connector counts — needs real app state, so it stays as an
         actual Angular template rather than markdown (content set via [innerHTML] is never
         evaluated by Angular, so bindings/pipes here would otherwise just print as literal text). -->
    <ul class="text-16">
      <li>
        <b>{{ countMappingInbound$ | async }}</b>
        <a [routerLink]="ROUTE_INBOUND"> inbound</a> and
        <b>{{ countMappingOutbound$ | async }}</b>
        <a [routerLink]="ROUTE_OUTBOUND"> outbound</a>
        mappings are currently defined.
      </li>
      <li>
        <b>{{ countConnector$ | async }}</b>
        <a [routerLink]="ROUTE_CONNECTORS"> connectors</a> are currently defined.
      </li>
    </ul>

    <!-- The three-tier "where to start" table that routes the reader onward. -->
    <div [innerHTML]="htmlNextSteps"></div>
  </div>
</div>
