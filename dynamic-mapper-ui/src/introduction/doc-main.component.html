<!-- ================================================================================ -->
<!-- SEARCH BAR — rendered into the Cumulocity action bar (stays fixed at top)        -->
<!-- ================================================================================ -->
<c8y-action-bar-item [placement]="'left'" itemClass="navbar-form">
  <div class="d-flex a-i-center g-8">
    <div class="input-group doc-search-input-group">
      <span class="input-group-addon"><i c8yIcon="search"></i></span>
      <input type="text" class="form-control" placeholder="Search documentation…"
        [(ngModel)]="searchQuery" (input)="onSearch()" (keydown.escape)="clearSearch()" name="docSearch" />
      @if (searchQuery) {
      <span class="input-group-btn">
        <button class="btn btn-default" type="button" (click)="clearSearch()" title="Clear search">
          <i c8yIcon="times"></i>
        </button>
      </span>
      }
    </div>
    @if (searchQuery.length >= 2) {
      @if (searchMatchCount === 0) {
        <span class="text-muted doc-search-count">No matches</span>
      } @else {
        <span class="doc-search-count">{{ searchCurrentIndex + 1 }}&nbsp;/&nbsp;{{ searchMatchCount }}</span>
        <button class="btn btn-xs btn-default" type="button" (click)="prevMatch()" title="Previous match">
          <i c8yIcon="chevron-up"></i>
        </button>
        <button class="btn btn-xs btn-default" type="button" (click)="nextMatch()" title="Next match">
          <i c8yIcon="chevron-down"></i>
        </button>
      }
    }
  </div>
</c8y-action-bar-item>

<!-- ================================================================================ -->
<!-- PAGE SWITCHER — each page rendered by its own sub-component                       -->
<!-- ================================================================================ -->
<div #docContent>
  <router-outlet></router-outlet>
</div>
