<ng-template #autoRefreshTemplate>
  <form class="d-flex a-i-center" [formGroup]="toggleIntervalForm">
    <label class="text-normal text-muted flex-no-shrink m-r-8 m-b-0" id="listLabel">Auto refresh</label>
    <div class="input-group">
      <label class="toggle-countdown" placement="bottom" data-cy="c8y-alarms-interval-refresh--toggle-countdown">
        <input type="checkbox" data-cy="c8y-alarms-interval-toggle" formControlName="intervalToggle"
          (click)="trackUserClickOnIntervalToggle($event)" />
        <c8y-countdown-interval [countdownInterval]="nextTriggerCountdown$| async"
          (countdownEnded)="onCountdownEnded()"></c8y-countdown-interval>
        <i data-cy="c8y-alarms-interval-refresh--pause" c8yIcon="pause"></i>
      </label>
      <div class="c8y-select-wrapper" style="max-width: 180px">
        <select aria-labelledby="listLabel" name="listLabel" class="form-control" formControlName="refreshInterval"
          required>
          @for (item of intervals; track item) {
          <option [value]="item.value">
            {{ item.label }}
          </option>
          }
        </select>
        <span></span>
      </div>
    </div>
  </form>
</ng-template>

@if (!selectable) {
<div class="d-flex a-i-center m-b-8 p-l-8 p-t-8">
  <label class="text-normal text-muted flex-no-shrink m-r-8 m-b-0">{{ 'Direction' | translate }}</label>
  <div class="c8y-select-wrapper" style="min-width: 130px">
    <select class="form-control" [(ngModel)]="selectedDirectionFilter"
      (ngModelChange)="onDirectionFilterChange($event)">
      <option value="ALL">{{ 'All' | translate }}</option>
      <option [value]="Direction.INBOUND">{{ 'Inbound' | translate }}</option>
      <option [value]="Direction.OUTBOUND">{{ 'Outbound' | translate }}</option>
    </select>
    <span></span>
  </div>
</div>
}

<c8y-data-grid [ngClass]="customClasses" #connectorGrid [title]="'Connectors'" [selectable]="selectable && !readOnly"
  [columns]="columns" [selectionPrimaryKey]="'identifier'" [configureColumnsEnabled]="false"
  [rows]="configurations$ | async" [pagination]="pagination" [actionControls]="actionControls"
  [headerActionControls]="headerActionControls"
  (itemsSelect)="onSelectionChanged($event)">
  <c8y-ui-empty-state [icon]="'c8y-icon dlt-c8y-icon-connected'" [title]="'No connectors exist.' | translate"
    [subtitle]="
  'Create your first connector.' | translate
  " [horizontal]="true">
  </c8y-ui-empty-state>
</c8y-data-grid>


@if (selectable) {
<div>
  <label>Selected connectors for mapping</label>
  <div class="bg-level-1 p-t-2 p-b-2">
    @for (identifier of deploymentMapEntry?.connectors; track identifier; let i = $index) {
    <span class="text-12 label label-primary m-r-8">
      {{ findNameByIdent(identifier) }}</span>
    }
  </div>
</div>
}
