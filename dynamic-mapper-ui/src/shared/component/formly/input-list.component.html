<ul c8yInputGroupListContainer class="list-unstyled">
  @for (item of dataInternal; track trackByIndex(i, item); let i = $index) {
    <li class="m-b-8 fit-w">
      <c8y-input-group-list [attr.aria-label]="('Input group' | translate) + '-' + (i + 1)" [index]="i" (onAdd)="add()"
        (onRemove)="remove($event)" [minus]="dataInternal.length > 1">
        <div class="col-xs-3" style="padding-left:0px">
          <input type="text" [name]="'key-' + i" class="form-control m-r-4"
            placeholder="{{ 'header key' | translate }}"
            [attr.aria-label]="('header key' | translate) + '-' + (i + 1)" [(ngModel)]="item.key" [required]="true"
            [disabled]="disabled()" (ngModelChange)="onInputChange()" #key />
        </div>
        <div class="col-xs-8" style="padding-left:0px">
          <input type="text" [name]="'value-' + i" class="form-control" placeholder="{{ 'value' | translate }}"
            [attr.aria-label]="('value' | translate) + '-' + (i + 1)"
            [(ngModel)]="item.value" [required]="true" [disabled]="disabled()" (ngModelChange)="onInputChange()"
            #value />
        </div>
      </c8y-input-group-list>
    </li>
  }
</ul>
<div class="sr-only" aria-live="polite">{{ liveMessage() | translate }}</div>
