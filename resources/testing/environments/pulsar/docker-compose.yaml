services:
  pulsar:
    image: apachepulsar/pulsar:${PULSAR_VERSION:-4.0.6}
    container_name: pulsar-standalone
    ports:
      - "6650:6650"   # broker (pulsar://localhost:6650)
      # admin / REST (http://localhost:9090); host port moved off 8080, which the local
      # dynamic-mapper-service uses. Override with PULSAR_ADMIN_PORT.
      - "${PULSAR_ADMIN_PORT:-9090}:8080"
    environment:
      # keep the standalone JVMs small enough for a dev laptop
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
    volumes:
      # data only: mounting /pulsar/conf would pin stale config across image upgrades
      - pulsardata:/pulsar/data
    command: bin/pulsar standalone
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/admin/v2/brokers/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  pulsar-init:
    image: apachepulsar/pulsar:${PULSAR_VERSION:-4.0.6}
    depends_on:
      pulsar:
        condition: service_healthy
    restart: "no"
    environment:
      - TENANT=${TENANT:-example-tenant}
    # $$ escapes compose interpolation so the container's own TENANT is used
    command: >
      bash -c '
        admin="bin/pulsar-admin --admin-url http://pulsar:8080"

        echo "Creating tenant $$TENANT..."
        $$admin tenants create $$TENANT --admin-roles admin --allowed-clusters standalone \
          || echo "Tenant $$TENANT already exists, continuing..."

        echo "Creating namespace $$TENANT/mqtt..."
        $$admin namespaces create $$TENANT/mqtt \
          || echo "Namespace $$TENANT/mqtt already exists, continuing..."

        echo "Setup completed"
      '

volumes:
  pulsardata:
