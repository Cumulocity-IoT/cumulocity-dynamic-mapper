# Keys are strings and values are bytes (text is UTF-8, binary outbound payloads are sent unchanged).
# KafkaClientV2 forces these serializers, also after the connector-level overrides, so these entries
# only document the default. The send code is typed ProducerRecord<String, byte[]>; another class set via
# defaultPropertiesProducer is ignored with a warning.
key.serializer=org.apache.kafka.common.serialization.StringSerializer
value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
security.protocol=SASL_SSL
#sasl.mechanism=SCRAM-SHA-256
linger.ms=1

# Wait for all in-sync replicas so a failed write surfaces as an error on the request
acks=all
# enable.idempotence is deliberately not set: Kafka enables it by default, but silently turns it
# off when a connector overrides acks to 0/1. An explicit true here would make such overrides
# fail at producer construction.
# Keep delivery bounded close to the 10s future.get() in KafkaClientV2
# (delivery.timeout.ms must be >= linger.ms + request.timeout.ms)
request.timeout.ms=10000
delivery.timeout.ms=15000
