# Keys and payloads are handled as strings. KafkaClientV2.buildKafkaProperties() forces the
# String (de)serializer classes before connector-level overrides are applied, so these entries
# only document the default. The send/receive code is typed String; a non-String class set via
# defaultPropertiesConsumer will not work.
key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
security.protocol=SASL_SSL
#sasl.mechanism=SCRAM-SHA-256

# Offsets are committed by the connector only after the mapping pipeline succeeded
# (at-least-once); auto-commit would commit regardless of processing outcome.
enable.auto.commit=false
# New consumer groups start at the end of the topic
auto.offset.reset=latest
# Smaller batches keep processing within max.poll.interval.ms (default 5 min)
max.poll.records=100
