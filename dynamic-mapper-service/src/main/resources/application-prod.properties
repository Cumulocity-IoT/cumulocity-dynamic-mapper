APP.additionalSubscriptionIdTest=

# The platform's /etc/<service>-logging.xml pins org.apache.pulsar.client to ERROR and
# overrides logback-spring.xml; logging.level.* still applies on top of it.
logging.level.org.apache.pulsar.client=INFO

# OTLP export (logs, traces, metrics) to Grafana Alloy. Override with OTEL_EXPORTER_OTLP_ENDPOINT
# or OTEL_SDK_DISABLED=true to turn it off.
otel.sdk.disabled=false
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://cumulocity-grafana-alloy:4318
otel.resource.attributes.service.name=Dynamic-Mapper-Service
# For a hosted gateway (e.g. Grafana Cloud) use its https URL plus:
#otel.exporter.otlp.headers=Authorization=Basic xxx
otel.instrumentation.runtime-telemetry.enabled=true
otel.instrumentation.micrometer.enabled=true
otel.instrumentation.spring-core.enabled=true